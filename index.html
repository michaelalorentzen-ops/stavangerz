<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stavanger Z</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
</head>
<body>
<div id="app">
  <header class="top">
    <div class="brand"><h1>STAVANGER <b>Z</b></h1><span id="area-phase">Fase 1</span></div>
    <div class="day" id="day">Dag 1</div>
    <div class="res" id="res"></div>
  </header>
  <main class="layout">
    <section class="mapwrap" aria-label="Kart">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="maptools" role="group" aria-label="Kartutsnitt">
        <button id="v-focus" aria-pressed="true"><span id="area-name">Området</span></button>
        <button id="v-all" aria-pressed="false"><span id="area-all">Alt</span></button>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--red)"></i>Infisert</span>
        <span><i style="background:var(--amber)"></i>Ryddet</span>
        <span><i style="background:#3a0f12;border:1px dashed var(--red)"></i>Horde</span>
        <span><i style="border:1px dashed var(--faint)"></i>Ukjent sone</span>
      </div>
      <div class="scale" id="scale"></div>
      <div class="attr">Kartdata © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bidragsytere</div>
    </section>
    <aside class="panel">
      <div class="scroll">
        <section id="tutorial"></section>
        <section id="goals"></section>
        <nav class="tabs" id="tabs" role="tablist" aria-label="Panel"></nav>
        <section class="pane" id="pane-sted" role="tabpanel" aria-labelledby="tab-sted"><div id="sel"></div></section>
        <section class="pane" id="pane-crew" role="tabpanel" aria-labelledby="tab-crew" hidden><div class="crew" id="crew"></div></section>
        <section class="pane" id="pane-lager" role="tabpanel" aria-labelledby="tab-lager" hidden><div id="stash"></div></section>
        <section class="pane" id="pane-logg" role="tabpanel" aria-labelledby="tab-logg" hidden><div id="log"></div></section>
      </div>
      <div class="foot">
        <div class="plan" id="plan"></div>
        <button class="btn" id="end">Avslutt dag</button>
      </div>
    </aside>
  </main>
</div>
<div class="modal" id="modal" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
