<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html,body{margin:0}[hidden]{display:none!important}</style></head><body>
<title>Stavanger Z</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Kartbord om natta: sjøkart-mørke, varmt nødlys for det som er vårt, rødt for det som ikke er det. */
:root {
  --sea: #0a141c; --sea-2: #0d1a24; --contour: #1a3a50;
  --land: #1a242c; --land-edge: #2c3c48; --bld: #26323c; --road: #33424e; --road-major: #5a6a75;
  --ink: #ece6d8; --muted: #8f9ba4; --faint: #5d6a74;
  --panel: #0e1820; --panel-2: #142330; --line: #223340;
  --amber: #f2a93b; --amber-soft: rgba(242,169,59,.14);
  --red: #e5484d; --red-soft: rgba(229,72,77,.16);
  --green: #7bc47f; --teal: #6fb7b4;
  --f-display: 'Saira Stencil One', 'Arial Black', Impact, sans-serif;
  --f-cond: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --f-body: 'Barlow', system-ui, -apple-system, sans-serif;
  --f-mono: 'IBM Plex Mono', ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--sea); color: var(--ink); font: 15px/1.45 var(--f-body); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

#app { display: grid; grid-template-rows: auto 1fr; height: 100%; }

/* ---- topplinje ---- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 22px; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 1px solid var(--line); background: var(--panel); }
.brand { display: flex; align-items: baseline; gap: 10px; }
.brand h1 { margin: 0; font: 26px/1 var(--f-display); letter-spacing: .02em; }
.brand h1 b { color: var(--red); font-weight: inherit; }
.brand span { font: 600 13px/1 var(--f-cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.day { font: 700 15px/1 var(--f-cond); letter-spacing: .12em; text-transform: uppercase; padding: 6px 10px; border: 1px solid var(--amber); color: var(--amber); border-radius: 3px; }
.res { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-left: auto; }
.r { display: grid; grid-template-columns: auto auto; column-gap: 6px; align-items: baseline; }
.r .k { font: 600 11px/1 var(--f-cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); grid-column: 1 / -1; }
.r .v { font: 500 18px/1.1 var(--f-mono); font-variant-numeric: tabular-nums; }
.r .d { font: 12px/1 var(--f-mono); color: var(--faint); }
.r.low .v { color: var(--red); }
.moral { min-width: 92px; }
.moral .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin-top: 5px; grid-column: 1 / -1; }
.moral .bar i { display: block; height: 100%; background: var(--amber); }

/* ---- hovedlayout ---- */
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 390px; min-height: 0; }
.mapwrap { position: relative; min-height: 0; overflow: hidden; background: var(--sea); }
#map { display: block; width: 100%; height: 100%; touch-action: manipulation; }
.maptools { position: absolute; top: 12px; left: max(12px, env(safe-area-inset-left, 0px)); display: flex; gap: 0; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; background: var(--panel); }
.maptools button { border: 0; background: none; padding: 7px 12px; font: 600 13px/1 var(--f-cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.maptools button[aria-pressed="true"] { background: var(--panel-2); color: var(--ink); box-shadow: inset 0 -2px 0 var(--amber); }
.legend { position: absolute; bottom: 12px; left: max(12px, env(safe-area-inset-left, 0px)); display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 10px; background: rgba(14,24,32,.86); border: 1px solid var(--line); border-radius: 4px; font: 600 12px/1 var(--f-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; margin-right: 6px; vertical-align: -2px; border-radius: 2px; }
.scale { position: absolute; bottom: 14px; right: 14px; font: 11px/1 var(--f-mono); color: var(--muted); text-align: right; }
.attr { position: absolute; top: 14px; right: 14px; font: 11px/1 var(--f-mono); color: var(--faint); }
.attr a { color: inherit; }
.scale div { height: 6px; border: 1px solid var(--muted); border-top: 0; margin-top: 4px; }

/* kartlag */
.sector { cursor: pointer; transition: fill-opacity .3s; }
.sector:hover { fill-opacity: 1; }
.s-inf .fillbase { fill: var(--red); fill-opacity: .12; }
.s-inf .edge { stroke: var(--red); stroke-width: 3; fill: url(#hatchRed); animation: pulse 2.6s ease-in-out infinite; }
.s-clr .fillbase { fill: var(--amber); fill-opacity: .12; }
.s-clr .edge { stroke: var(--amber); stroke-width: 3.5; fill: none; }
.s-lock .fillbase { fill: #3a0f12; fill-opacity: .55; }
.s-lock .edge { stroke: var(--red); stroke-width: 2; stroke-dasharray: 10 8; fill: url(#hatchDark); }
.sector.sel .edge { stroke: var(--ink); stroke-width: 6; }
.sector:hover .edge { stroke-width: 5; }
@keyframes pulse { 50% { stroke-opacity: .35; } }
.lab { font: 700 30px/1 var(--f-cond); letter-spacing: .1em; text-transform: uppercase; fill: var(--ink); paint-order: stroke; stroke: var(--sea); stroke-width: 7px; stroke-linejoin: round; pointer-events: none; }
.lab.sub { font: 500 22px/1 var(--f-mono); letter-spacing: 0; stroke-width: 6px; }
.lab.sub.inf { fill: #ff8b8e; }
.lab.sub.clr { fill: var(--amber); }
.lab.zone { font-size: 38px; fill: var(--muted); letter-spacing: .2em; }
.lab.zsub { font: 600 18px/1 var(--f-cond); letter-spacing: .2em; fill: var(--faint); stroke-width: 5px; }
.lab.big { font: 400 54px/1 var(--f-display); fill: #ff6b6f; letter-spacing: .06em; }
.zone { cursor: pointer; fill: transparent; stroke: var(--faint); stroke-width: 2; stroke-dasharray: 6 9; }
.zone:hover, .zone.sel { stroke: var(--ink); stroke-dasharray: none; fill: rgba(236,230,216,.04); }
.gate { cursor: pointer; }
.gate rect.box { fill: var(--panel); stroke-width: 3; }
.gate.l0 rect.box { stroke: var(--red); }
.gate.on rect.box { stroke: var(--amber); }
.gate.sel rect.box { stroke: var(--ink); stroke-width: 5; }
.gate text { font: 700 20px/1 var(--f-cond); letter-spacing: .12em; fill: var(--ink); text-transform: uppercase; }
.gate .pip { fill: var(--line); }
.gate .pip.on { fill: var(--amber); }
.token circle { fill: var(--ink); stroke: var(--sea); stroke-width: 4; }
.token.hurt circle { fill: #ffb3a8; }
.token text { font: 700 19px/1 var(--f-cond); fill: var(--sea); text-anchor: middle; dominant-baseline: central; }
.token.t-lete circle { fill: var(--teal); }
.token.t-befeste circle { fill: var(--amber); }
@media (prefers-reduced-motion: reduce) { .s-inf .edge { animation: none; } }

/* ---- panel ---- */
.panel { display: flex; flex-direction: column; min-height: 0; border-left: 1px solid var(--line); background: var(--panel); }
.scroll { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 18px; }
.eyebrow { font: 600 12px/1 var(--f-cond); letter-spacing: .16em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.goals { display: grid; gap: 6px; font-size: 14px; }
.goal { display: flex; justify-content: space-between; gap: 10px; }
.goal b { font: 500 13px var(--f-mono); color: var(--muted); }
.goal.done { color: var(--amber); }
.goal.done b { color: var(--amber); }
.prog { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; margin-top: 4px; }
.prog i { display: block; height: 100%; background: var(--amber); }

.card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 14px; display: grid; gap: 10px; }
.card h2 { margin: 0; font: 700 26px/1.05 var(--f-cond); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
.card p { margin: 0; color: #c9c3b6; }
.badge { justify-self: start; font: 700 12px/1 var(--f-cond); letter-spacing: .14em; text-transform: uppercase; padding: 4px 7px; border-radius: 3px; }
.badge.inf { background: var(--red-soft); color: #ff8b8e; }
.badge.clr { background: var(--amber-soft); color: var(--amber); }
.badge.lock { background: #3a0f12; color: #ff8b8e; }
.badge.fog { background: var(--line); color: var(--muted); }
.metrics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.metric { border-top: 1px solid var(--line); padding-top: 6px; }
.metric .k { font: 600 11px/1.2 var(--f-cond); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.metric .v { font: 500 18px/1.3 var(--f-mono); font-variant-numeric: tabular-nums; }
.metric .v small { font-size: 11px; color: var(--muted); }
.hint { font-size: 13px; color: var(--muted); }
.seg { display: flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { flex: 1; border: 0; background: none; padding: 7px 8px; font: 600 13px/1 var(--f-cond); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--line); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 11px; font: 600 14px/1.2 var(--f-cond); letter-spacing: .04em; }
.chip small { color: var(--muted); font-weight: 500; margin-left: 4px; }
.chip[aria-pressed="true"] { border-color: var(--amber); background: var(--amber-soft); color: var(--amber); }

.crew { display: grid; gap: 8px; }
.cm { display: grid; grid-template-columns: 1fr auto; gap: 6px 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); }
.cm .nm { font: 700 17px/1.1 var(--f-cond); letter-spacing: .03em; }
.cm .nm small { font: 500 13px var(--f-body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.cm .tr { grid-column: 1 / -1; font-size: 12.5px; color: var(--muted); }
.cm .tr b { color: var(--teal); font-weight: 600; }
.hp { display: flex; gap: 3px; align-items: center; }
.hp i { width: 14px; height: 6px; border-radius: 2px; background: var(--line); }
.hp i.on { background: var(--green); }
.hp.h2 i.on { background: var(--amber); }
.hp.h1 i.on { background: var(--red); }
.statrow { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }
.st { font: 600 10.5px/1 var(--f-cond); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.st .pips { display: flex; gap: 2px; margin-top: 3px; }
.st .pips i { flex: 1; height: 4px; background: var(--line); border-radius: 1px; }
.st .pips i.on { background: var(--ink); }
.cm select { grid-column: 1 / -1; width: 100%; padding: 7px 8px; background: var(--panel); border: 1px solid var(--line); border-radius: 4px; }
.cm.busy select { border-color: var(--amber); }

.foot { border-top: 1px solid var(--line); padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 8px; background: var(--panel); }
.plan { font-size: 13px; color: var(--muted); }
.btn { border: 0; border-radius: 4px; padding: 12px 16px; background: var(--amber); color: #1b1305; font: 700 17px/1 var(--f-cond); letter-spacing: .12em; text-transform: uppercase; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
.btn:disabled { opacity: .4; cursor: not-allowed; }

/* ---- modal ---- */
.modal { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 20px max(16px, env(safe-area-inset-right, 0px)) 20px max(16px, env(safe-area-inset-left, 0px)); background: rgba(5,10,14,.78); backdrop-filter: blur(3px); overflow-y: auto; }
.sheet { width: min(640px, 100%); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 22px; display: grid; gap: 16px; box-shadow: 0 30px 80px rgba(0,0,0,.5); }
.sheet.wide { width: min(980px, 100%); }
.sheet h2 { margin: 0; font: 700 30px/1.05 var(--f-cond); letter-spacing: .04em; text-transform: uppercase; text-wrap: balance; }
.sheet p { margin: 0; max-width: 62ch; }
.radio { font: 500 12px/1 var(--f-mono); letter-spacing: .08em; color: var(--teal); text-transform: uppercase; display: flex; align-items: center; gap: 8px; }
.radio::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); }
.transcript { white-space: pre-line; font: 15px/1.6 var(--f-body); color: #d8d1c2; border-left: 2px solid var(--line); padding-left: 14px; }
.choices { display: grid; gap: 8px; }
.choice { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 12px 14px; display: flex; justify-content: space-between; gap: 12px; align-items: center; }
.choice:hover { border-color: var(--amber); }
.choice small { font: 500 12px var(--f-mono); color: var(--muted); white-space: nowrap; }
.result { padding: 12px 14px; border-radius: 6px; background: var(--panel-2); border: 1px solid var(--line); }
.result.ok { border-color: rgba(123,196,127,.5); }
.result.fail { border-color: rgba(229,72,77,.5); }
.result .tag { font: 700 12px/1 var(--f-cond); letter-spacing: .14em; text-transform: uppercase; margin-bottom: 6px; }
.result.ok .tag { color: var(--green); }
.result.fail .tag { color: var(--red); }
.logl { display: grid; gap: 7px; font: 14px/1.45 var(--f-mono); max-height: 52vh; overflow-y: auto; }
.logl div { padding-left: 14px; position: relative; color: #cfc8ba; }
.logl div::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 1px; background: var(--faint); }
.logl .good::before { background: var(--amber); }
.logl .find { color: var(--amber); }
.logl .find::before { background: var(--amber); }
.logl .bad { color: #ff9a9c; }
.logl .bad::before { background: var(--red); }
.logl .warn::before { background: #d98a4a; }
.logl .fun { color: var(--muted); font-style: italic; }
.row { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; }

.title { text-align: left; }
.title h1 { margin: 0; font: 400 clamp(44px, 9vw, 92px)/.9 var(--f-display); letter-spacing: .01em; }
.title h1 b { color: var(--red); font-weight: inherit; }
.title .kick { font: 600 14px/1 var(--f-cond); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); }
.coords { font: 12px/1.4 var(--f-mono); color: var(--faint); }

.statedit { display: grid; gap: 8px; }
.se { display: grid; grid-template-columns: 110px 1fr auto; gap: 10px; align-items: center; }
.se .lbl { font: 700 15px/1 var(--f-cond); letter-spacing: .08em; text-transform: uppercase; }
.se .lbl small { display: block; font: 400 12px/1.3 var(--f-body); color: var(--muted); letter-spacing: 0; text-transform: none; margin-top: 2px; }
.se .pips { display: flex; gap: 4px; }
.se .pips i { flex: 1; height: 10px; border-radius: 2px; background: var(--line); max-width: 44px; }
.se .pips i.on { background: var(--amber); }
.se .ctl { display: flex; gap: 4px; }
.se .ctl button { width: 32px; height: 32px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel-2); font: 700 18px/1 var(--f-mono); }
.field { display: grid; gap: 6px; }
.field label { font: 600 12px/1 var(--f-cond); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.field input { padding: 10px 12px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel-2); font-size: 17px; }
.picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.pick { text-align: left; border: 1px solid var(--line); background: var(--panel-2); border-radius: 6px; padding: 12px; display: grid; gap: 6px; align-content: start; }
.pick[aria-pressed="true"] { border-color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); }
.pick .nm { font: 700 20px/1 var(--f-cond); letter-spacing: .03em; }
.pick .role { font-size: 13px; color: var(--muted); }
.pick .q { font-size: 13px; font-style: italic; color: #c9c3b6; }
.pick .tr { font-size: 12.5px; color: var(--teal); }
.pick .statrow { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; }

@media (max-width: 860px) {
  #app { height: auto; min-height: 100%; }
  .layout { grid-template-columns: 1fr; }
  .mapwrap { height: min(72vh, 118vw); }
  .panel { border-left: 0; border-top: 1px solid var(--line); }
  .scroll { overflow: visible; }
  .foot { position: sticky; bottom: 0; }
  .res { margin-left: 0; width: 100%; }
  .legend { display: none; }
  .se { grid-template-columns: 92px 1fr auto; }
}
</style>

<div id="app">
  <header class="top">
    <div class="brand"><h1>STAVANGER <b>Z</b></h1><span>Fase 1 · Buøy</span></div>
    <div class="day" id="day">Dag 1</div>
    <div class="res" id="res"></div>
  </header>
  <main class="layout">
    <section class="mapwrap" aria-label="Kart over Buøy og byøyene">
      <svg id="map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="maptools" role="group" aria-label="Kartutsnitt">
        <button id="v-focus" aria-pressed="true">Buøy</button>
        <button id="v-all" aria-pressed="false">Byøyene</button>
      </div>
      <div class="legend" aria-hidden="true">
        <span><i style="background:var(--red)"></i>Infisert</span>
        <span><i style="background:var(--amber)"></i>Klarert</span>
        <span><i style="background:#3a0f12;border:1px dashed var(--red)"></i>Horde</span>
        <span><i style="border:1px dashed var(--faint)"></i>Ukjent sone</span>
      </div>
      <div class="scale" id="scale"></div>
      <div class="attr">Kartdata © <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>-bidragsytere</div>
    </section>
    <aside class="panel">
      <div class="scroll">
        <section><p class="eyebrow">Mål for fase 1</p><div id="goals"></div></section>
        <section id="sel"></section>
        <section><p class="eyebrow">Crew</p><div class="crew" id="crew"></div></section>
      </div>
      <div class="foot">
        <div class="plan" id="plan"></div>
        <button class="btn" id="end">Avslutt dag</button>
      </div>
    </aside>
  </main>

function rand(s) {
  // mulberry32
  let t = (s.rng = (s.rng + 0x6d2b79f5) | 0);
  t = Math.imul(t ^ (t >>> 15), t | 1);
  t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
const pick = (s, arr) => arr[Math.floor(rand(s) * arr.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sround = (s, v) => Math.floor(v) + (rand(s) < v - Math.floor(v) ? 1 : 0);

// ---------- Oppsett ----------
function newGame(seed, self, neighborIds) {
  const s = {
    v: 1, seed, rng: seed | 0, day: 1, phase: 1, moral: 70, gear: 1,
    res: { mat: 12, vann: 10, medisin: 2, materialer: 4, drivstoff: 0 },
    flags: {}, crew: [], sectors: {}, gates: {}, seenEvents: [], log: [], over: null,
    stats: { kills: 0, found: 0, lost: 0 },
  };
  s.crew.push({ id: 'meg', name: self.name || 'Deg', role: 'Deg', trait: self.trait, stats: { ...self.stats }, hp: 3, task: { type: 'hvile' }, kills: 0, me: true });
  for (const id of neighborIds) addNeighbor(s, id);
  for (const id of PLAYABLE) {
    const d = SECTORS[id];
    s.sectors[id] = { z: d.z, hidden: d.hidden, loot: { ...d.loot }, lootMax: sum(Object.values(d.loot)), miss: null, noise: 0, seen: id === 'hjem', special: false, cleared: false };
  }
  for (const id in GATES) s.gates[id] = { work: 0, level: 0 };
  return s;
}
function addNeighbor(s, id) {
  const n = NEIGHBORS.find((x) => x.id === id);
  s.crew.push({ id: n.id, name: n.name, role: n.role, trait: n.trait, stats: { ...n.stats }, hp: 3, task: { type: 'hvile' }, kills: 0 });
}
const sum = (a) => a.reduce((x, y) => x + y, 0);

// ---------- Avledede verdier ----------
function stat(c, k) {
  let v = c.stats[k];
  if (k === 'nerver' && c.trait === 'filmnerd') v += 1;
  if (k === 'kondis' && c.trait === 'buss' && c.task.type !== 'hvile') v += 1;
  return v;
}
function moralMult(s) { return s.moral < 25 ? 0.75 : s.moral < 50 ? 0.9 : 1; }
function hpMult(c) { return c.hp >= 3 ? 1 : c.hp === 2 ? 0.85 : 0.55; }
function fightPower(s, c) {
  let p = stat(c, 'muskler') * 1.0 + stat(c, 'nerver') * 0.5 + stat(c, 'kondis') * 0.3;
  if (c.trait === 'hv') p += 2;
  return p * GEAR[s.gear].mult * moralMult(s) * hpMult(c);
}
function detectChance(team) {
  if (!team.length) return 0;
  const avg = sum(team.map((c) => stat(c, 'snoking'))) / team.length;
  let p = 0.1 + 0.05 * avg + (team.some((c) => c.trait === 'los') ? 0.1 : 0);
  return clamp(p, 0.05, 0.6);
}
function searchPower(s, c) {
  let p = stat(c, 'snoking') + stat(c, 'kondis') * 0.3;
  if (c.trait === 'lokalkjent') p += 2;
  return p * moralMult(s) * hpMult(c);
}
function buildPower(s, c) {
  let p = stat(c, 'mekk') + stat(c, 'muskler') * 0.4;
  if (c.trait === 'sveiser') p += 3;
  if (c.trait === 'hms' || c.trait === 'dugnad') p += 2;
  if (s.flags.aggregat) p *= 1.3;
  return p * moralMult(s) * hpMult(c);
}
function hasTrait(s, t) { return s.crew.some((c) => c.trait === t); }
function dailyFood(s) { return Math.max(1, Math.ceil(s.crew.length * 0.6) - (hasTrait(s, 'kokk') ? 1 : 0)); }
function dailyWater(s) { return Math.max(1, Math.ceil(s.crew.length * 0.5)); }

// Hva crewet tror om en sektor. Ekte tall bare der det er rimelig.
function sectorIntel(s, id) {
  const sec = s.sectors[id];
  const out = { status: sec.z > 0 ? 'infisert' : 'klarert' };
  if (!sec.seen) {
    const lo = Math.max(1, Math.round(sec.z * 0.6)), hi = Math.round(sec.z * 1.4) + 1;
    out.estimate = `${lo}–${hi}`;
  } else out.estimate = sec.z > 0 ? `${sec.z}` : '0';
  if (sec.z === 0) {
    const real = 1 - (sec.miss ?? 1);
    if (hasTrait(s, 'regneark')) { out.conf = Math.round(real * 100); out.confExact = true; }
    else out.conf = clamp(Math.round((real + sec.noise) * 100), 5, 99);
  }
  out.searched = Math.round((1 - sum(Object.values(sec.loot)) / Math.max(1, sec.lootMax)) * 100);
  return out;
}

// ---------- Ordre ----------
function taskOptions(s) {
  const opts = [{ type: 'hvile', label: 'Hvile hjemme' }];
  for (const id of PLAYABLE) {
    const sec = s.sectors[id], n = SECTORS[id].short;
    if (sec.z > 0) opts.push({ type: 'klarere', target: id, label: `Klarere ${n}` });
    else {
      if (sum(Object.values(sec.loot)) > 0) opts.push({ type: 'lete', target: id, label: `Lete i ${n}` });
      opts.push({ type: 'finsjekk', target: id, label: `Finsjekke ${n}` });
    }
  }
  for (const id in GATES) {
    const g = GATES[id], st = s.gates[id];
    if (st.level < 3 && s.sectors[g.sector].z === 0) opts.push({ type: 'befeste', target: id, label: `Befeste ${g.name}` });
  }
  return opts;
}
function defaultTaskFor(s, sectorId) {
  const sec = s.sectors[sectorId];
  if (sec.z > 0) return { type: 'klarere', target: sectorId };
  if (sum(Object.values(sec.loot)) > 0) return { type: 'lete', target: sectorId };
  return { type: 'finsjekk', target: sectorId };
}
function validateTasks(s) {
  for (const id of PLAYABLE) {
    const sec = s.sectors[id];
    if (sec.z > 0 && sec.cleared) { sec.cleared = false; sec.miss = null; }
    if (sec.z === 0 && !sec.cleared) { sec.cleared = true; sec.miss = sec.miss ?? 0.7; sec.noise = 0; }
  }
  const valid = taskOptions(s);
  for (const c of s.crew) {
    if (!valid.some((o) => o.type === c.task.type && o.target === c.task.target)) c.task = { type: 'hvile' };
  }
}

// ---------- Dagsoppgjør ----------
function resolveDay(s) {
  const L = [];
  const log = (t, kind = '') => L.push({ t, kind });
  const team = (type, target) => s.crew.filter((c) => c.task.type === type && c.task.target === target);
  const injure = (c, why) => {
    c.hp -= 1;
    if (c.hp <= 0) {
      log(`${c.name} ble bitt ${why}. ${pick(s, EULOGY)(c)}`, 'bad');
      s.moral -= 15; s.stats.lost++;
      s.crew = s.crew.filter((x) => x !== c);
    } else log(`${c.name} ble skadet ${why} (${HEALTH_LABEL[c.hp].toLowerCase()}).`, 'warn');
  };

  // 1) Klarering og finsjekk
  for (const id of PLAYABLE) {
    const sec = s.sectors[id];
    const clr = team('klarere', id), fin = team('finsjekk', id);
    const all = [...clr, ...fin];
    if (!all.length) continue;
    sec.seen = true;
    if (clr.length && sec.z > 0) {
      const power = sum(clr.map((c) => fightPower(s, c)));
      const before = sec.z;
      let kills = Math.min(sec.z, sround(s, power * (0.35 + rand(s) * 0.25)));
      sec.z -= kills; s.stats.kills += kills;
      // fordel drap for statistikk
      for (let i = 0; i < kills; i++) pick(s, clr).kills++;
      const names = clr.map((c) => c.name).join(' og ');
      log(`${names} ryddet ${kills} zombie${kills === 1 ? '' : 'r'} i ${SECTORS[id].short}.${sec.z > 0 ? ` ${sec.z} igjen.` : ''}`);
      for (const c of clr) {
        const risk = clamp(0.04 + 0.22 * (before / (power * 1.5 + 1)) - stat(c, 'kondis') * 0.02, 0.02, 0.4);
        if (rand(s) < risk) injure(c, `i ${SECTORS[id].short}`);
      }
      if (clr.some((c) => c.trait === 'hv') && rand(s) < 0.3) log('Tor-Egil sammenlignet det med øvelse Cold Response. Igjen.', 'fun');
      if (clr.some((c) => c.trait === 'russ') && rand(s) < 0.25) log('Sondre filmet alt til en TikTok ingen kommer til å se.', 'fun');
    }
    // Leting etter skjulte (kjellere, boder, garasjer)
    const checkers = sec.z === 0 ? all : fin;
    if (checkers.length && sec.hidden > 0) {
      const p = detectChance(checkers) + (fin.length ? 0.1 : 0);
      let found = 0;
      for (let i = 0; i < sec.hidden; i++) if (rand(s) < p) found++;
      if (found) {
        sec.hidden -= found; s.stats.kills += found;
        log(`Fant ${found} zombie${found === 1 ? '' : 'r'} gjemt i kjellerboder i ${SECTORS[id].short}. Tatt hånd om.`, 'good');
        if (rand(s) < 0.15) injure(pick(s, checkers), 'i en kjellerbod');
      }
    }
    if (sec.z === 0 && checkers.length) {
      const p = detectChance(checkers) + (fin.length ? 0.1 : 0);
      sec.miss = (sec.miss ?? 1) * (1 - p);
    }
    if (sec.z === 0 && !sec.cleared) {
      sec.cleared = true;
      if (sec.miss == null) sec.miss = 1 - detectChance(all);
      sec.noise = (rand(s) - 0.3) * 0.35;
      log(`${SECTORS[id].name} er klarert.`, 'good');
      if (hasTrait(s, 'hms')) log('Kjell har fylt ut avviksskjema for klareringen. I tre eksemplarer.', 'fun');
    }
  }

  // 2) Leting
  for (const id of PLAYABLE) {
    const sec = s.sectors[id];
    const tm = team('lete', id);
    if (!tm.length) continue;
    const power = sum(tm.map((c) => searchPower(s, c)));
    const frac = 1 - Math.exp(-power * 0.09);
    const got = [];
    for (const r of RES) {
      const n = Math.min(sec.loot[r], sround(s, sec.loot[r] * frac));
      if (n > 0) { sec.loot[r] -= n; s.res[r] += n; s.stats.found += n; got.push(`${n} ${RES_LABEL[r].toLowerCase()}`); }
    }
    log(`${tm.map((c) => c.name).join(' og ')} lette i ${SECTORS[id].short}: ${got.length ? got.join(', ') : 'ingenting av verdi, bare IKEA-møbler'}.`);
    const left = sum(Object.values(sec.loot)) / sec.lootMax;
    if (!sec.special && left <= 0.5) {
      sec.special = true;
      const sp = SECTORS[id].special;
      log(sp.text, 'find');
      if (sp.res) for (const r in sp.res) s.res[r] += sp.res[r];
      if (sp.gear) s.gear = Math.max(s.gear, sp.gear);
      if (sp.flag) s.flags[sp.flag] = true;
      if (sp.moral) s.moral += sp.moral;
    }
    if (sec.hidden > 0 && rand(s) < 0.15 * sec.hidden) {
      sec.hidden -= 1; s.stats.kills++;
      const c = pick(s, tm);
      log(`En zombie lå gjemt i en bod i ${SECTORS[id].short}. ${c.name} fikk overraskelsen.`, 'warn');
      if (rand(s) < 0.35 - stat(c, 'kondis') * 0.04) injure(c, 'av en bodzombie');
    }
  }

  // 3) Befesting
  for (const id in GATES) {
    const tm = team('befeste', id);
    if (!tm.length) continue;
    const g = s.gates[id];
    let work = sum(tm.map((c) => buildPower(s, c)));
    const need = Math.ceil(work / 3);
    const used = Math.min(need, s.res.materialer);
    if (used < need) work *= used / need * 0.7 + 0.3;
    s.res.materialer -= used;
    g.work += work;
    const before = g.level;
    while (g.level < 3 && g.work >= GATE_STEPS[g.level + 1]) g.level++;
    log(`${tm.map((c) => c.name).join(' og ')} befestet ${GATES[id].name} (${used} materialer).${g.level > before ? ` Nå nivå ${g.level}.` : ''}${used < need ? ' Mangler materialer.' : ''}`, g.level > before ? 'good' : '');
  }

  // 4) Hvile
  for (const c of s.crew.filter((c) => c.task.type === 'hvile')) {
    if (c.hp >= 3) continue;
    const nurse = hasTrait(s, 'nattevakt');
    if (s.res.medisin > 0 && !(nurse && rand(s) < 0.5)) { s.res.medisin--; c.hp++; log(`${c.name} ble plastret med medisin.`); }
    else if (nurse || rand(s) < 0.35) { c.hp++; log(`${c.name} kom seg etter en dag på sofaen${nurse ? ' (og Monas strenge regime)' : ''}.`); }
  }

  // 5) Forbruk
  const eat = dailyFood(s), drink = dailyWater(s);
  s.res.mat -= eat; s.res.vann -= drink;
  if (s.res.mat < 0) { s.res.mat = 0; s.moral -= 10; log('Det er tomt for mat. Noen foreslo å spise måkene. Ingen lo.', 'bad'); }
  if (s.res.vann < 0) { s.res.vann = 0; s.moral -= 12; log('Tomt for vann. I Stavanger. Det er nesten imponerende.', 'bad'); }
  if (rand(s) < 0.4) { const n = 3 + Math.floor(rand(s) * 4); s.res.vann += n; log(`Det regnet. Selvfølgelig. +${n} vann.`, 'fun'); }

  // 6) Natt: press mot sperringene. Crew som jobber ved porten tar vakta.
  for (const id in GATES) {
    const g = GATES[id], st = s.gates[id];
    const chance = clamp(g.base - st.level * 0.15 + s.day * 0.004, 0.02, 0.9);
    if (rand(s) >= chance) continue;
    let n = Math.max(1, 1 + Math.floor(rand(s) * (1 + s.day / 6)) - st.level);
    const guards = s.crew.filter((c) => (c.task.type === 'befeste' && c.task.target === id) || (['klarere', 'finsjekk'].includes(c.task.type) && c.task.target === g.sector));
    if (guards.length) {
      const k = Math.min(n, sround(s, sum(guards.map((c) => fightPower(s, c))) * 0.35));
      n -= k; s.stats.kills += k;
      if (!n) { log(`Natt: ${k} zombie${k === 1 ? '' : 'r'} prøvde seg ved ${g.name}. ${guards.map((c) => c.name).join(' og ')} holdt vakt.`, 'good'); continue; }
    }
    const target = id === 'ros' ? pick(s, ['hjem', 'obs', 'tommerodden', 'sorspissen']) : g.sector;
    const sec = s.sectors[target];
    const wasClear = sec.z === 0;
    sec.z += n;
    if (wasClear) { sec.cleared = false; sec.miss = null; s.moral -= 4; }
    log(`Natt: ${n} zombie${n === 1 ? '' : 'r'} kom forbi ${g.name} og inn i ${SECTORS[target].short}.${wasClear ? ' Sektoren er infisert igjen.' : ''}`, wasClear ? 'bad' : 'warn');
  }
  // 7) Natt: glemte kjellere
  for (const id of PLAYABLE) {
    const sec = s.sectors[id];
    if (sec.z === 0 && sec.hidden > 0 && rand(s) < 0.1 * sec.hidden) {
      const n = sec.hidden + Math.floor(rand(s) * 3);
      sec.z = n; sec.hidden = 0; sec.cleared = false; sec.miss = null;
      s.moral -= 8;
      log(`Natt: Noen glemte å sjekke kjelleren i ${SECTORS[id].short}. ${n} zombier strømmer ut. Sektoren er infisert igjen.`, 'bad');
    }
  }

  s.moral = clamp(s.moral + 2, 0, 100);
  s.day++;
  validateTasks(s);
  checkEnd(s);
  s.log.push({ day: s.day - 1, lines: L });
  if (s.log.length > 40) s.log.shift();
  return L;
}

function phaseProgress(s) {
  const cleared = PLAYABLE.filter((id) => s.sectors[id].z === 0).length;
  const gates = Object.keys(GATES).map((id) => ({ id, name: GATES[id].name, level: s.gates[id].level }));
  return { cleared, total: PLAYABLE.length, gates, done: cleared === PLAYABLE.length && gates.every((g) => g.level >= 2) };
}
function checkEnd(s) {
  if (s.over) return;
  if (!s.crew.length) s.over = 'dead';
  else if (phaseProgress(s).done) s.over = 'won';
}

const EULOGY = [
  (c) => `Hvil i fred, ${c.name}. Vi tar vare på kaffekoppen din.`,
  (c) => `${c.name} er ikke lenger med oss. Teknisk sett er ${c.name} fortsatt med oss, bare ikke på vår side.`,
  (c) => `Crewet holder ett minutts stillhet. Det blir avbrutt av stønning fra Bybrua.`,
];

function best(s, k) { return s.crew.reduce((a, c) => (stat(c, k) > stat(a, k) ? c : a), s.crew[0]); }
function checkOdds(s, k, base = 0.25) { return clamp(base + stat(best(s, k), k) * 0.12, 0.05, 0.95); }
function roll(s, k, base) { return rand(s) < checkOdds(s, k, base); }
function recruitable(s) { return NEIGHBORS.filter((n) => !s.crew.some((c) => c.id === n.id) && !s.flags['gone_' + n.id]); }

    id: 'joggezombie', title: 'Joggezombien',
    when: (s) => s.day >= 2,
    text: () => 'En zombie i Helly Hansen-tights løper i jevnt tempo rundt Buøy. Den har en Garmin. Den har aldri tatt hviledag og har ikke tenkt å begynne nå.',
    choices: [
      { label: 'Legg en felle', check: 'mekk', run: (s, ok) => { if (ok) { s.res.medisin += 2; return 'Den løper rett inn i en presenning. Lommene inneholder Paracet og gel-poser. Personlig rekord: avsluttet.'; } return 'Den hopper over fella uten å miste tempo. Imponerende, egentlig.'; } },
      { label: 'Ignorer den', run: (s) => { s.moral -= 2; return 'Den løper forbi vinduet hver morgen klokka seks. Det tar på psyken.'; } },
    ],
  },
  {
    id: 'sirene', title: 'Skiftsirenen',
    text: () => 'Klokka 07:00 går skiftsirenen på Rosenberg av, på timer som vanlig. Alle zombier på vestsiden snur seg mot verftet.',
    choices: [
      { label: 'Utnytt det: angrip mens de er distrahert', run: (s) => { let n = 0; for (const id of ['obs', 'tommerodden', 'hjem']) { const k = Math.min(s.sectors[id].z, 2); s.sectors[id].z -= k; n += k; } s.stats.kills += n; return `Dere tar ${n} zombier bakfra. Sirenen er den beste kollegaen dere har hatt.`; } },
      { label: 'Forsterk gjerdet mens de samles', run: (s) => { s.gates.ros.work += 4; while (s.gates.ros.level < 3 && s.gates.ros.work >= GATE_STEPS[s.gates.ros.level + 1]) s.gates.ros.level++; return 'Dere bruker roen til å forsterke Rosenberg-gjerdet.'; } },
    ],
  },
  {
    id: 'arsmote', title: 'Ekstraordinært årsmøte',
    when: (s) => s.crew.some((c) => c.trait === 'hms'),
    text: () => 'Kjell har kalt inn til ekstraordinært årsmøte. Sak 1: Zombier. Sak 2: Hvem som har parkert på gjesteplassen.',
    choices: [
      { label: 'Delta på møtet', run: (s) => { s.moral += 8; return 'Møtet varer i tre timer. Vedtak: zombier er ikke tillatt i fellesarealene. Alle føler seg tryggere.'; } },
      { label: 'Send fullmakt og jobb videre', run: (s) => { s.res.materialer += 3; s.moral -= 3; return 'Kjell er skuffet, men dere finner materialer i sykkelboden mens alle andre sitter i møte.'; } },
    ],
  },
  {
    id: 'katt', title: 'Katten',
    text: () => 'En feit, oransje katt sitter på trappa. Den har tydeligvis klart seg utmerket. Den ser på deg som om du skylder den penger.',
    choices: [
      { label: 'Adopter katten', run: (s) => { s.moral += 10; s.res.mat = Math.max(0, s.res.mat - 1); s.flags.katt = true; return 'Katten heter nå Kaptein Kjeks. Den varsler før zombier kommer. Det tror dere i hvert fall.'; } },
      { label: 'La katten være', run: (s) => 'Katten går. Den kommer tilbake i morgen. Den har allerede adoptert dere.' },
    ],
  },
  {
    id: 'oljeskift', title: 'Oljefolk på avveie',
    when: (s) => s.day >= 4,
    text: () => 'En gruppe i oransje kjeledresser kommer gående fra Tømmerodden. De har nettopp kommet fra en tre ukers turnus i Nordsjøen og vet ingenting om noe.',
    choices: [
      { label: 'Forklar situasjonen', check: 'prat', run: (s, ok) => { if (ok) { s.res.materialer += 4; s.res.drivstoff += 3; s.moral += 4; return 'De tar det overraskende pent, gir dere utstyret sitt og drar for å finne familiene sine.'; } return '«Er dette en sikkerhetsøvelse?» De går videre for å finne en kaffemaskin.'; } },
      { label: 'Be dem om hjelp til gjerdet', run: (s) => { s.gates.ros.work += 5; while (s.gates.ros.level < 3 && s.gates.ros.work >= GATE_STEPS[s.gates.ros.level + 1]) s.gates.ros.level++; return 'De bygger på gjerdet i én dag, med full sikkerhetsbrief først.'; } },
    ],
  },
  {
    id: 'kaffe', title: 'Kaffekrisen',
    when: (s) => s.day >= 5,
    text: () => 'Kaffen er tom. Crewet stirrer på deg. Dette er det farligste øyeblikket så langt.',
    choices: [
      { label: 'Raid nærmeste kiosk', check: 'kondis', run: (s, ok) => { if (ok) { s.moral += 12; return 'To kilo Friele. Moralen er reddet. Sivilisasjonen består.'; } const c = best(s, 'kondis'); c.hp = Math.max(1, c.hp - 1); s.moral -= 5; return `${c.name} kom tilbake med te. Og en skade. Mest te.`; } },
      { label: 'Rasjoner det som er igjen av grut', run: (s) => { s.moral -= 8; return 'Grutkaffe nummer tre. Ingen sier noe. Alle tenker det.'; } },
    ],
  },
  {
    id: 'dronningen', title: 'Seilbåten',
    when: (s) => s.day >= 3,
    text: () => 'En seilbåt glir inn mot kaia ved Sørspissen. Rorsmannen roper: «Har dere drivstoff? Jeg har hermetikk!»',
    choices: [
      { label: 'Bytt 3 drivstoff mot mat', when: (s) => s.res.drivstoff >= 3, run: (s) => { s.res.drivstoff -= 3; s.res.mat += 10; return 'Handel gjennomført. Han seiler mot Kvitsøy og ønsker dere lykke til.'; } },
      { label: 'Prut', check: 'prat', run: (s, ok) => { if (ok) { s.res.mat += 6; return 'Han gir dere seks hermetikkbokser bare fordi du minner ham om nevøen hans.'; } return 'Han seiler videre og mumler noe om «byfolk».'; } },
      { label: 'Vink farvel', run: (s) => 'Han seiler mot horisonten. Dere ser aldri hvordan det går med ham.' },
    ],
  },
  {
    id: 'ryfast', title: 'Lyder fra tunnelen',
    when: (s) => s.day >= 6,
    text: () => 'Det kommer lyder fra Hundvågtunnelen. Skraping. Stønning. Og så noen som synger «Mitt hjerte er i Stavanger».',
    choices: [
      { label: 'Forsterk Nordporten', run: (s) => { s.gates.nord.work += 3; while (s.gates.nord.level < 3 && s.gates.nord.work >= GATE_STEPS[s.gates.nord.level + 1]) s.gates.nord.level++; return 'Dere bruker natta på å forsterke Nordporten. Sangen stopper rundt fire.'; } },
      { label: 'Undersøk', check: 'nerver', run: (s, ok) => { if (ok) { s.res.drivstoff += 6; return 'Det var en zombie med Bluetooth-høyttaler. Bak ham står en tankbil med diesel.'; } s.sectors.nordkrysset.z += 3; return 'Det var ikke én zombie. Tre av dem følger dere tilbake til Nordkrysset.'; } },
    ],
  },
  {
    id: 'vaffel', title: 'Foreldrekomiteen',
    when: (s) => s.sectors.skolen.z === 0,
    text: () => 'På Buøy skole finner dere FAU-lista over hvem som skulle bake til 17. mai. Halvparten har krysset seg av.',
    choices: [
      { label: 'Les den høyt med NRK-stemme', run: (s) => { s.moral += 6; return 'Det er dumt. Alle ler likevel.'; } },
      { label: 'Sjekk skapene til de som ikke krysset av', check: 'snoking', run: (s, ok) => { if (ok) { s.res.mat += 6; s.res.medisin += 1; return 'De som ikke hadde bakt, hadde kjøpt ferdigkake. Mange av dem.'; } return 'Bare tomme Tupperware-bokser. Lokkene mangler.'; } },
    ],
  },
  {
    id: 'svein', title: 'Svein i hekken',
    when: (s) => s.day >= 2 && !s.flags.svein,
    text: () => 'Naboen Svein står fortsatt i hagen og tygger på hekken. Han var alltid opptatt av hekken. Nå er han bokstavelig talt opptatt av den.',
    choices: [
      { label: 'Gjør det nødvendige', check: 'nerver', run: (s, ok) => { s.flags.svein = true; if (ok) { s.res.materialer += 2; return 'Det er gjort. Dere låner hekksaksen hans. Han hadde ikke noe imot det.'; } s.moral -= 6; return 'Ingen klarer det. Til slutt gjør Svein det selv ved å gå inn i bassenget.'; } },
      { label: 'La Svein klippe hekken', run: (s) => { s.flags.svein = true; s.moral += 2; return 'Hekken har aldri vært penere. Respekt, Svein.'; } },
    ],
  },
];

function drawEvent(s) {
  const pool = EVENTS.filter((e) => !s.seenEvents.includes(e.id) && (!e.when || e.when(s)));
  if (!pool.length || rand(s) > 0.6) return null;
  const e = pick(s, pool);
  s.seenEvents.push(e.id);
  return e;
}
function runChoice(s, ev, ch) {
  const ok = ch.check ? roll(s, ch.check) : true;
  const text = ch.run(s, ok);
  s.moral = clamp(s.moral, 0, 100);
  validateTasks(s);
  checkEnd(s);
  return { ok, text };
}

</script>
<script>
// Stavanger Z – grensesnitt: kart, panel og modaler.
const SAVE_KEY = 'stavanger-z-v1';
const NS = 'http://www.w3.org/2000/svg';
const $ = (id) => document.getElementById(id);
const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

let S = null;                    // spilltilstand
let sel = { kind: 'sector', id: 'hjem' };
let selAction = null;            // valgt handling i sektorkortet
let view = 'focus';
let vb = MAP.focus.slice();

function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) { /* lagring er en bonus */ } }
function load() { try { const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; } catch (e) { return null; } }
function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignorer */ } }

// ================= KART =================
const svg = $('map');
function el(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}
function toLatLon(x, y) { return { lat: MAP.geo.N - y / 1e5, lon: MAP.geo.W + x / (MAP.geo.KX * 1e5) }; }
function fromLat(lat) { return (MAP.geo.N - lat) * 1e5; }
function fromLon(lon) { return (lon - MAP.geo.W) * MAP.geo.KX * 1e5; }
function dm(v, h) { const d = Math.floor(v), m = (v - d) * 60; return `${d}°${m.toFixed(1).padStart(4, '0')}′${h}`; }

let dyn;
function buildStaticMap() {
  const [x, y, w, h] = MAP.view;
  const defs = el('defs', {}, svg);
  defs.innerHTML = `
    <pattern id="hatchRed" width="22" height="22" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="22" height="22" fill="none"/><line x1="0" y1="0" x2="0" y2="22" stroke="#e5484d" stroke-width="5" stroke-opacity=".38"/></pattern>
    <pattern id="hatchDark" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(-45)">
      <rect width="16" height="16" fill="none"/><line x1="0" y1="0" x2="0" y2="16" stroke="#e5484d" stroke-width="3" stroke-opacity=".5"/></pattern>
    <filter id="fog" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.0025" numOctaves="4" seed="11"/>
      <feColorMatrix values="0 0 0 0 0.04  0 0 0 0 0.07  0 0 0 0 0.10  0 0 0 -0.9 1.0"/>
    </filter>
    <radialGradient id="vign" cx="50%" cy="50%" r="70%"><stop offset="60%" stop-color="#05090d" stop-opacity="0"/><stop offset="100%" stop-color="#05090d" stop-opacity=".7"/></radialGradient>
    <mask id="fogmask"><rect x="${x - 2000}" y="${y - 2000}" width="${w + 4000}" height="${h + 4000}" fill="#fff"/>
      ${MAP.sectors.map((s) => `<path d="${s.d}" fill="#000" stroke="#000" stroke-width="40"/>`).join('')}</mask>`;
  el('rect', { x: x - 3000, y: y - 3000, width: w + 6000, height: h + 6000, fill: 'var(--sea)' }, svg);
  // sjøkartrutenett med ekte koordinater
  const grid = el('g', { stroke: '#132836', 'stroke-width': 2 }, svg);
  const ll0 = toLatLon(x, y + h), ll1 = toLatLon(x + w, y);
  for (let lat = Math.ceil(ll0.lat / 0.005) * 0.005; lat < ll1.lat; lat += 0.005) el('line', { x1: x - 3000, x2: x + w + 3000, y1: fromLat(lat), y2: fromLat(lat) }, grid);
  for (let lon = Math.ceil(ll0.lon / 0.01) * 0.01; lon < ll1.lon; lon += 0.01) el('line', { y1: y - 3000, y2: y + h + 3000, x1: fromLon(lon), x2: fromLon(lon) }, grid);
  const depth = el('g', { fill: 'none', stroke: 'var(--contour)' }, svg);
  MAP.depth.forEach((d, i) => el('path', { d, 'stroke-width': 3 - i, 'stroke-opacity': [0.9, 0.55, 0.3][i] }, depth));
  el('path', { d: MAP.land, fill: 'var(--land)', stroke: 'var(--land-edge)', 'stroke-width': 2 }, svg);
  el('path', { d: MAP.buildings, fill: 'var(--bld)' }, svg);
  el('path', { d: MAP.roads.minor, fill: 'none', stroke: 'var(--road)', 'stroke-width': 3, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
  el('path', { d: MAP.roads.major, fill: 'none', stroke: 'var(--road-major)', 'stroke-width': 6, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, svg);
  // tåke over alt som ikke er Buøy
  el('rect', { x: x - 300, y: y - 300, width: w + 600, height: h + 600, filter: 'url(#fog)', mask: 'url(#fogmask)' }, svg);
  el('rect', { x: x - 300, y: y - 300, width: w + 600, height: h + 600, fill: '#070d12', 'fill-opacity': 0.2, mask: 'url(#fogmask)' }, svg);
  // koordinatmerker
  const tick = el('g', { class: 'ticks' }, svg);
  for (let lat = Math.ceil(ll0.lat / 0.005) * 0.005; lat < ll1.lat; lat += 0.005) {
    const t = el('text', { x: x + 14, y: fromLat(lat) - 8, class: 'lab zsub', style: 'font-family:var(--f-mono);letter-spacing:0' }, tick); t.textContent = dm(lat, 'N');
  }
  for (let lon = Math.ceil(ll0.lon / 0.01) * 0.01; lon < ll1.lon; lon += 0.01) {
    const t = el('text', { x: fromLon(lon) + 8, y: y + h - 14, class: 'lab zsub', style: 'font-family:var(--f-mono);letter-spacing:0' }, tick); t.textContent = dm(lon, 'Ø');
  }
  // fremtidige soner
  const zones = el('g', {}, svg);
  for (const z of MAP.zones) {
    const p = el('path', { d: z.d, class: 'zone', 'data-zone': z.id, tabindex: 0, role: 'button', 'aria-label': z.name }, zones);
    p.addEventListener('click', () => select('zone', z.id));
    p.addEventListener('keydown', (e) => { if (e.key === 'Enter') select('zone', z.id); });
  }
  for (const z of MAP.zones) {
    const t = el('text', { x: z.cx, y: z.cy, class: 'lab zone', 'text-anchor': 'middle' }, zones); t.textContent = z.name;
    const u = el('text', { x: z.cx, y: z.cy + 30, class: 'lab zsub', 'text-anchor': 'middle' }, zones); u.textContent = z.id === 'hundvag' ? 'Fase 3 · ukjent' : 'Ukjent';
  }
  dyn = el('g', {}, svg);
  el('rect', { x: x - 3000, y: y - 3000, width: w + 6000, height: h + 6000, fill: 'url(#vign)', 'pointer-events': 'none' }, svg);
  setViewBox(vb);
}

function setViewBox(b) {
  vb = b;
  svg.setAttribute('viewBox', b.map((n) => n.toFixed(1)).join(' '));
  updateScale();
}
function animateView(to) {
  const from = vb.slice(), t0 = performance.now(), dur = matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 650;
  const step = (t) => {
    const k = dur ? Math.min(1, (t - t0) / dur) : 1, e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    setViewBox(from.map((v, i) => v + (to[i] - v) * e));
    if (k < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}
function updateScale() {
  const r = svg.getBoundingClientRect();
  if (!r.width) return;
  const pxPerUnit = Math.min(r.width / vb[2], r.height / vb[3]);
  const meters = vb[2] > 2000 ? 500 : 250;
  const units = meters / 1.11;
  $('scale').innerHTML = `${meters} m<div style="width:${(units * pxPerUnit).toFixed(0)}px"></div>`;
}

function renderMap() {
  dyn.innerHTML = '';
  const tokensBy = {};
  for (const c of S.crew) {
    if (c.task.type === 'hvile') (tokensBy.hjem = tokensBy.hjem || []).push(c);
    else if (c.task.type === 'befeste') (tokensBy['g_' + c.task.target] = tokensBy['g_' + c.task.target] || []).push(c);
    else (tokensBy[c.task.target] = tokensBy[c.task.target] || []).push(c);
  }
  for (const m of MAP.sectors) {
    const id = m.id, isLocked = id === 'rosenberg';
    const intel = isLocked ? null : sectorIntel(S, id);
    const cls = isLocked ? 's-lock' : intel.status === 'infisert' ? 's-inf' : 's-clr';
    const g = el('g', { class: `sector ${cls}${sel.kind === 'sector' && sel.id === id ? ' sel' : ''}`, tabindex: 0, role: 'button', 'aria-label': SECTORS[id].name }, dyn);
    el('path', { d: m.d, class: 'fillbase' }, g);
    el('path', { d: m.d, class: 'edge', 'stroke-linejoin': 'round' }, g);
    g.addEventListener('click', () => select('sector', id));
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter') select('sector', id); });
  }
  for (const m of MAP.sectors) {
    const id = m.id;
    if (id === 'rosenberg') {
      const t = el('text', { x: m.cx, y: m.cy - 10, class: 'lab big', 'text-anchor': 'middle' }, dyn); t.textContent = 'HORDE';
      const u = el('text', { x: m.cx, y: m.cy + 28, class: 'lab', 'text-anchor': 'middle' }, dyn); u.textContent = 'Rosenberg Verft';
      const v = el('text', { x: m.cx, y: m.cy + 58, class: 'lab sub inf', 'text-anchor': 'middle' }, dyn); v.textContent = 'Fase 2';
      continue;
    }
    const intel = sectorIntel(S, id);
    const t = el('text', { x: m.cx, y: m.cy - 6, class: 'lab', 'text-anchor': 'middle' }, dyn); t.textContent = SECTORS[id].short;
    const u = el('text', { x: m.cx, y: m.cy + 22, class: `lab sub ${intel.status === 'infisert' ? 'inf' : 'clr'}`, 'text-anchor': 'middle' }, dyn);
    u.textContent = intel.status === 'infisert' ? `${intel.estimate} Z` : `✓ ${intel.conf}%`;
    drawTokens(tokensBy[id], m.cx, m.cy + 58);
  }
  for (const id in GATES) {
    const gd = GATES[id], st = S.gates[id];
    const g = el('g', { class: `gate ${st.level ? 'on' : 'l0'}${sel.kind === 'gate' && sel.id === id ? ' sel' : ''}`, transform: `translate(${gd.x} ${gd.y})`, tabindex: 0, role: 'button', 'aria-label': gd.name }, dyn);
    el('rect', { class: 'box', x: -48, y: -22, width: 96, height: 44, rx: 6 }, g);
    for (let i = 0; i < 3; i++) el('rect', { class: `pip${i < st.level ? ' on' : ''}`, x: -36 + i * 26, y: 4, width: 20, height: 8, rx: 2 }, g);
    const t = el('text', { x: 0, y: -4, 'text-anchor': 'middle' }, g); t.textContent = st.level ? `Nivå ${st.level}` : 'Åpen';
    g.addEventListener('click', () => select('gate', id));
    g.addEventListener('keydown', (e) => { if (e.key === 'Enter') select('gate', id); });
    drawTokens(tokensBy['g_' + id], gd.x, gd.y + 50);
  }
  for (const z of MAP.zones) svg.querySelector(`[data-zone="${z.id}"]`).classList.toggle('sel', sel.kind === 'zone' && sel.id === z.id);
}
function drawTokens(list, cx, cy) {
  if (!list) return;
  const gap = 46, x0 = cx - ((list.length - 1) * gap) / 2;
  list.forEach((c, i) => {
    const g = el('g', { class: `token t-${c.task.type}${c.hp < 3 ? ' hurt' : ''}`, transform: `translate(${x0 + i * gap} ${cy})`, 'pointer-events': 'none' }, dyn);
    el('circle', { r: 20 }, g);
    const t = el('text', {}, g); t.textContent = c.name.slice(0, 2);
  });
}

// ================= PANEL =================
function renderTop() {
  $('day').textContent = `Dag ${S.day}`;
  const food = dailyFood(S), water = dailyWater(S);
  const cell = (k, v, d, low) => `<div class="r${low ? ' low' : ''}"><span class="k">${k}</span><span class="v">${v}</span><span class="d">${d || ''}</span></div>`;
  $('res').innerHTML =
    cell('Mat', S.res.mat, `−${food}/d`, S.res.mat < food * 2) +
    cell('Vann', S.res.vann, `−${water}/d`, S.res.vann < water * 2) +
    cell('Medisin', S.res.medisin) +
    cell('Materialer', S.res.materialer) +
    cell('Drivstoff', S.res.drivstoff) +
    `<div class="r moral"><span class="k">Moral ${S.moral}</span><span class="bar"><i style="width:${S.moral}%;${S.moral < 30 ? 'background:var(--red)' : ''}"></i></span></div>`;
}
function renderGoals() {
  const p = phaseProgress(S);
  const row = (txt, val, done) => `<div class="goal${done ? ' done' : ''}"><span>${done ? '✓ ' : ''}${txt}</span><b>${val}</b></div>`;
  $('goals').innerHTML = `<div class="goals">
    ${row('Klarer alle sektorer på Buøy', `${p.cleared}/${p.total}`, p.cleared === p.total)}
    ${p.gates.map((g) => row(`${g.name} på nivå 2`, `${g.level}/2`, g.level >= 2)).join('')}
    <div class="hint">Utstyr: ${GEAR[S.gear].name}</div>
  </div>`;
}

function crewChips(isMine, assign, label) {
  return `<div class="chips">${S.crew.map((c) => {
    const on = isMine(c);
    const cur = c.task.type === 'hvile' ? 'hviler' : on ? '' : taskShort(c.task);
    return `<button class="chip" data-crew="${c.id}" aria-pressed="${on}">${esc(c.name)}${cur ? `<small>${cur}</small>` : ''}</button>`;
  }).join('')}</div>`;
}
function taskShort(t) {
  if (t.type === 'befeste') return 'bygger';
  const map = { klarere: 'klarerer', lete: 'leter', finsjekk: 'sjekker' };
  return `${map[t.type]} ${SECTORS[t.target].short}`;
}
function lootHint(sec) {
  const tiers = Object.entries(sec.loot).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]);
  if (!tiers.length) return 'Tømt for alt nyttig.';
  return 'Rykter om: ' + tiers.slice(0, 3).map(([k, v]) => `${v >= 10 ? 'mye ' : v >= 4 ? '' : 'litt '}${RES_LABEL[k].toLowerCase()}`).join(', ') + '.';
}

function renderSel() {
  const box = $('sel');
  if (sel.kind === 'sector' && sel.id === 'rosenberg') {
    box.innerHTML = `<div class="card"><span class="badge lock">Horde · Fase 2</span><h2>Rosenberg Verft</h2><p>${SECTORS.rosenberg.desc}</p>
      <div class="metrics"><div class="metric"><div class="k">Horde</div><div class="v">60–120</div></div>
      <div class="metric"><div class="k">Kapasitet</div><div class="v">???</div></div><div class="metric"><div class="k">Forsvar</div><div class="v">???</div></div></div>
      <p class="hint">Dette er HQ-et ditt i fase 2. De ekte HQ-verdiene er skjulte. Hold Rosenberg-gjerdet oppe så horden blir der den er.</p></div>`;
    return;
  }
  if (sel.kind === 'zone') {
    const z = MAP.zones.find((z) => z.id === sel.id);
    box.innerHTML = `<div class="card"><span class="badge fog">Ukjent sone</span><h2>${esc(z.name)}</h2><p>${ZONE_INFO[z.id] || ''}</p><p class="hint">Utenfor rekkevidde i fase 1. Sikre Buøy først.</p></div>`;
    return;
  }
  if (sel.kind === 'gate') {
    const gd = GATES[sel.id], st = S.gates[sel.id];
    const ready = S.sectors[gd.sector].z === 0;
    const next = GATE_STEPS[Math.min(3, st.level + 1)];
    const prev = GATE_STEPS[st.level];
    const pct = st.level >= 3 ? 100 : Math.round(((st.work - prev) / (next - prev)) * 100);
    const mine = (c) => c.task.type === 'befeste' && c.task.target === sel.id;
    box.innerHTML = `<div class="card"><span class="badge ${st.level ? 'clr' : 'inf'}">Sperring · nivå ${st.level}/3</span><h2>${gd.name}</h2><p>${gd.desc}</p>
      <div><div class="hint">${st.level >= 3 ? 'Fullt utbygd.' : `Fram til nivå ${st.level + 1}: ${pct}%`}</div><div class="prog"><i style="width:${pct}%"></i></div></div>
      <p class="hint">${ready ? 'Mekk teller mest. Hver arbeidsdag bruker materialer.' : `Klarer ${SECTORS[gd.sector].short} før dere kan bygge her.`}</p>
      ${ready && st.level < 3 ? `<p class="eyebrow" style="margin:0">Send til befesting</p>${crewChips(mine)}` : ''}</div>`;
    box.querySelectorAll('[data-crew]').forEach((b) => b.addEventListener('click', () => {
      const c = S.crew.find((x) => x.id === b.dataset.crew);
      c.task = mine(c) ? { type: 'hvile' } : { type: 'befeste', target: sel.id };
      refresh();
    }));
    return;
  }
  const id = sel.id, sec = S.sectors[id], intel = sectorIntel(S, id);
  const inf = intel.status === 'infisert';
  const actions = inf ? ['klarere'] : [...(intel.searched < 100 ? ['lete'] : []), 'finsjekk'];
  if (!actions.includes(selAction)) selAction = actions[0];
  const actLabel = { klarere: 'Klarere', lete: 'Lete', finsjekk: 'Finsjekke' };
  const mine = (c) => c.task.type === selAction && c.task.target === id;
  box.innerHTML = `<div class="card">
    <span class="badge ${inf ? 'inf' : 'clr'}">${inf ? 'Infisert' : 'Klarert'}${id === 'hjem' ? ' · Du bor her' : ''}</span>
    <h2>${SECTORS[id].name}</h2><p>${SECTORS[id].desc}</p>
    <div class="metrics">
      <div class="metric"><div class="k">Zombier</div><div class="v">${intel.estimate}${!sec.seen && inf ? ' <small>anslag</small>' : ''}</div></div>
      <div class="metric"><div class="k">Sikkerhet</div><div class="v">${inf ? '–' : `${intel.conf}%`}${!inf ? ` <small>${intel.confExact ? 'regneark' : 'magefølelse'}</small>` : ''}</div></div>
      <div class="metric"><div class="k">Gjennomsøkt</div><div class="v">${intel.searched}%</div></div>
    </div>
    <p class="hint">${inf ? 'Muskler og Nerver dreper zombier. Snoking finner dem som gjemmer seg i kjellere. Send flere sammen for å unngå skader.' : `${lootHint(sec)} Lav sikkerhet betyr at noe kan ligge igjen i en kjeller.`}</p>
    ${actions.length > 1 ? `<div class="seg" role="group">${actions.map((a) => `<button data-act="${a}" aria-pressed="${a === selAction}">${actLabel[a]}</button>`).join('')}</div>` : ''}
    <p class="eyebrow" style="margin:0">Send til ${actLabel[selAction].toLowerCase()}</p>
    ${crewChips(mine)}
  </div>`;
  box.querySelectorAll('[data-act]').forEach((b) => b.addEventListener('click', () => { selAction = b.dataset.act; renderSel(); }));
  box.querySelectorAll('[data-crew]').forEach((b) => b.addEventListener('click', () => {
    const c = S.crew.find((x) => x.id === b.dataset.crew);
    c.task = mine(c) ? { type: 'hvile' } : { type: selAction, target: id };
    refresh();
  }));
}

function statPips(st, cls = 'st') {
  return STATS.map((k) => `<div class="${cls}">${STAT_LABEL[k].slice(0, 3)}<div class="pips">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= st[k] ? 'on' : ''}"></i>`).join('')}</div></div>`).join('');
}
function renderCrew() {
  const opts = taskOptions(S);
  $('crew').innerHTML = S.crew.map((c) => {
    const val = c.task.type + ':' + (c.task.target || '');
    return `<div class="cm${c.task.type !== 'hvile' ? ' busy' : ''}">
      <div class="nm">${esc(c.name)}<small>${esc(c.role)}</small></div>
      <div class="hp h${c.hp}" title="${HEALTH_LABEL[c.hp]}">${[1, 2, 3].map((i) => `<i class="${i <= c.hp ? 'on' : ''}"></i>`).join('')}</div>
      <div class="tr"><b>${TRAITS[c.trait].name}.</b> ${TRAITS[c.trait].desc}</div>
      <div class="statrow">${statPips(c.stats)}</div>
      <select data-crew="${c.id}" aria-label="Oppdrag for ${esc(c.name)}">${opts.map((o) => `<option value="${o.type}:${o.target || ''}"${o.type + ':' + (o.target || '') === val ? ' selected' : ''}>${o.label}</option>`).join('')}</select>
    </div>`;
  }).join('');
  $('crew').querySelectorAll('select').forEach((s) => s.addEventListener('change', () => {
    const c = S.crew.find((x) => x.id === s.dataset.crew);
    const [type, target] = s.value.split(':');
    c.task = target ? { type, target } : { type };
    refresh();
  }));
}
function renderPlan() {
  const groups = {};
  for (const c of S.crew) { const k = c.task.type === 'hvile' ? 'hviler' : taskShort(c.task) + (c.task.type === 'befeste' ? ' ' + GATES[c.task.target].name : ''); (groups[k] = groups[k] || []).push(c.name); }
  $('plan').textContent = Object.entries(groups).map(([k, v]) => `${v.join(', ')} ${k}`).join(' · ');
  $('end').textContent = `Avslutt dag ${S.day}`;
}

function select(kind, id) { sel = { kind, id }; selAction = null; renderSel(); renderMap(); if (innerWidth <= 860) $('sel').scrollIntoView({ behavior: 'smooth', block: 'nearest' }); }
let previewing = false;
function refresh() { renderTop(); renderGoals(); renderSel(); renderCrew(); renderPlan(); renderMap(); if (!previewing) save(); }

// ================= MODALER =================
function modal(html, wide) {
  $('sheet').className = 'sheet' + (wide ? ' wide' : '');
  $('sheet').innerHTML = html;
  $('modal').hidden = false;
  const f = $('sheet').querySelector('button, input');
  if (f) f.focus({ preventScroll: true });
  $('modal').scrollTop = 0;
}
function closeModal() { $('modal').hidden = true; }

function titleScreen() {
  const saved = load();
  modal(`<div class="title" style="display:grid;gap:18px">
    <div class="kick">Et turbasert overlevelsesspill fra byøyene</div>
    <h1>STAVANGER <b>Z</b></h1>
    <p>Utbruddet starter en tirsdag morgen. Du bor på Buøy. Bybrua er stengt, Rosenberg er overkjørt, og det regner. Samle et crew blant naboene, klarer øya sektor for sektor og bygg sperringer før natta tar dere.</p>
    <div class="coords">58°59′N 5°43′Ø · Buøy, Hundvåg bydel</div>
    <div class="row" style="justify-content:flex-start">
      <button class="btn" id="new">Ny runde</button>
      ${saved && !saved.over ? `<button class="btn ghost" id="cont">Fortsett dag ${saved.day}</button>` : ''}
    </div></div>`);
  $('new').onclick = createSelf;
  if ($('cont')) $('cont').onclick = () => { S = saved; closeModal(); refresh(); };
}

const draft = { name: '', stats: { muskler: 3, kondis: 2, snoking: 3, nerver: 3, mekk: 2, prat: 2 }, trait: 'lokalkjent', picks: [] };
const POOL = 15;
function createSelf() {
  const used = sum(Object.values(draft.stats));
  modal(`<span class="eyebrow">Steg 1 av 2</span><h2>Hvem er du?</h2>
    <div class="field"><label for="nm">Navn</label><input id="nm" maxlength="18" placeholder="Deg" value="${esc(draft.name)}"></div>
    <div><p class="eyebrow">Fordel ${POOL} poeng · ${POOL - used} igjen</p><div class="statedit">
    ${STATS.map((k) => `<div class="se"><div class="lbl">${STAT_LABEL[k]}<small>${STAT_HINT[k]}</small></div>
      <div class="pips">${[1, 2, 3, 4, 5].map((i) => `<i class="${i <= draft.stats[k] ? 'on' : ''}"></i>`).join('')}</div>
      <div class="ctl"><button data-k="${k}" data-d="-1" aria-label="Mindre ${STAT_LABEL[k]}">−</button><button data-k="${k}" data-d="1" aria-label="Mer ${STAT_LABEL[k]}">+</button></div></div>`).join('')}
    </div></div>
    <div><p class="eyebrow">Egenskap</p><div class="picks">${SELF_TRAITS.map((t) => `<button class="pick" data-t="${t}" aria-pressed="${draft.trait === t}"><span class="nm" style="font-size:17px">${TRAITS[t].name}</span><span class="role">${TRAITS[t].desc}</span></button>`).join('')}</div></div>
    <div class="row"><button class="btn ghost" id="back">Tilbake</button><button class="btn" id="next" ${used !== POOL ? 'disabled' : ''}>Velg naboer</button></div>`, true);
  $('nm').addEventListener('input', (e) => (draft.name = e.target.value));
  $('sheet').querySelectorAll('[data-k]').forEach((b) => b.addEventListener('click', () => {
    const k = b.dataset.k, d = +b.dataset.d, v = draft.stats[k] + d;
    if (v < 1 || v > 5 || sum(Object.values(draft.stats)) + d > POOL) return;
    draft.stats[k] = v; createSelf();
  }));
  $('sheet').querySelectorAll('[data-t]').forEach((b) => b.addEventListener('click', () => { draft.trait = b.dataset.t; createSelf(); }));
  $('back').onclick = titleScreen;
  $('next').onclick = pickNeighbors;
}
function pickNeighbors() {
  modal(`<span class="eyebrow">Steg 2 av 2</span><h2>Velg tre naboer</h2>
    <p>Disse er i live og banker på døra di. Du har plass til tre. De andre må klare seg selv. Kanskje dukker de opp igjen.</p>
    <div class="picks">${START_NEIGHBORS.map((id) => { const n = NEIGHBORS.find((x) => x.id === id); return `<button class="pick" data-n="${id}" aria-pressed="${draft.picks.includes(id)}">
      <span class="nm">${n.name} <small style="font:400 14px var(--f-body);color:var(--muted)">${n.age}</small></span><span class="role">${n.role}</span>
      <span class="tr">${TRAITS[n.trait].name}: ${TRAITS[n.trait].desc}</span><span class="q">«${n.quip}»</span>
      <span class="statrow">${statPips(n.stats)}</span></button>`; }).join('')}</div>
    <div class="row"><span class="hint" style="margin-right:auto;align-self:center">${draft.picks.length}/3 valgt</span><button class="btn ghost" id="back">Tilbake</button><button class="btn" id="go" ${draft.picks.length !== 3 ? 'disabled' : ''}>Start utbruddet</button></div>`, true);
  $('sheet').querySelectorAll('[data-n]').forEach((b) => b.addEventListener('click', () => {
    const id = b.dataset.n, i = draft.picks.indexOf(id);
    if (i >= 0) draft.picks.splice(i, 1); else if (draft.picks.length < 3) draft.picks.push(id);
    pickNeighbors();
  }));
  $('back').onclick = createSelf;
  $('go').onclick = () => {
    previewing = false;
    S = newGame((Date.now() ^ (Math.random() * 1e9)) | 0, { name: draft.name.trim() || 'Deg', stats: draft.stats, trait: draft.trait }, draft.picks);
    sel = { kind: 'sector', id: 'hjem' };
    refresh();
    showEvent(INTRO, () => { closeModal(); refresh(); });
  };
}

function showEvent(ev, done) {
  const body = typeof ev.text === 'function' ? ev.text(S) : ev.text;
  const choices = ev.choices.filter((c) => !c.when || c.when(S));
  modal(`<div class="radio">${ev.channel || 'Samband · kanal 16'} · Dag ${S.day}</div><h2>${ev.title}</h2>
    <div class="transcript">${esc(body)}</div>
    <div class="choices">${choices.map((c, i) => `<button class="choice" data-i="${i}"><span>${c.label}</span>${c.check ? `<small>${STAT_LABEL[c.check]} · ${best(S, c.check).name} · ${Math.round(checkOdds(S, c.check) * 100)}%</small>` : ''}</button>`).join('')}</div>`);
  $('sheet').querySelectorAll('[data-i]').forEach((b) => b.addEventListener('click', () => {
    const ch = choices[+b.dataset.i];
    const r = runChoice(S, ev, ch);
    save();
    $('sheet').querySelector('.choices').outerHTML = `<div class="result ${ch.check ? (r.ok ? 'ok' : 'fail') : ''}">${ch.check ? `<div class="tag">${r.ok ? 'Lyktes' : 'Mislyktes'}</div>` : ''}${esc(r.text)}</div><div class="row"><button class="btn" id="ok">Videre</button></div>`;
    $('ok').focus();
    $('ok').onclick = done;
  }));
}

function endDay() {
  const day = S.day;
  const lines = resolveDay(S);
  const ev = S.over ? null : drawEvent(S);
  save();
  modal(`<div class="radio">Vaktlogg · Buøy</div><h2>Dag ${day} er over</h2>
    <div class="logl">${lines.map((l) => `<div class="${l.kind}">${esc(l.t)}</div>`).join('') || '<div>En stille dag. Mistenkelig stille.</div>'}</div>
    <div class="row"><button class="btn" id="ok">${ev ? 'Samband: ny melding' : `Start dag ${S.day}`}</button></div>`);
  $('ok').onclick = () => {
    if (ev) showEvent(ev, after); else after();
  };
  function after() {
    closeModal(); refresh();
    if (S.over) endScreen();
  }
}

function endScreen() {
  const st = S.stats;
  if (S.over === 'won') {
    modal(`<div class="radio">Samband · alle stasjoner</div><h2>Buøy er sikret</h2>
      <p>Fase 1 er fullført på ${S.day - 1} dager. Sperringene holder, kjellerne er (antakelig) tomme, og noen har hengt opp et banner på Obs Bygg: «BUØY: 1 – APOKALYPSEN: 0».</p>
      <div class="metrics"><div class="metric"><div class="k">Zombier ryddet</div><div class="v">${st.kills}</div></div>
      <div class="metric"><div class="k">Ressurser funnet</div><div class="v">${st.found}</div></div>
      <div class="metric"><div class="k">Crew mistet</div><div class="v">${st.lost}</div></div></div>
      <div class="card"><span class="badge lock">Neste: Fase 2</span><h2>Rosenberg Verft</h2>
      <p>Horden på verftet venter. ${S.flags.gann ? 'Skoleskipet Gann ligger klart ved Tømmerodden.' : 'Dere har ingen båt ennå.'} ${S.flags.buss ? 'Kolumbus-bussen på Sørspissen har full tank.' : 'Dere har ikke funnet transport ennå.'}</p></div>
      <div class="row"><button class="btn ghost" id="newr">Ny runde</button><button class="btn" id="cont">Fortsett på Buøy</button></div>`);
    $('cont').onclick = () => { S.over = 'won-seen'; closeModal(); refresh(); };
  } else {
    modal(`<div class="radio">Samband · ingen svar</div><h2>Buøy har falt</h2>
      <p>Crewet er borte. Kaffetrakteren står fortsatt på. Kjell ville ha skrevet et avviksskjema.</p>
      <div class="metrics"><div class="metric"><div class="k">Dager</div><div class="v">${S.day - 1}</div></div>
      <div class="metric"><div class="k">Zombier ryddet</div><div class="v">${st.kills}</div></div>
      <div class="metric"><div class="k">Ressurser funnet</div><div class="v">${st.found}</div></div></div>
      <div class="row"><button class="btn" id="newr">Prøv igjen</button></div>`);
  }
  $('newr').onclick = () => { wipe(); draft.picks = []; titleScreen(); };
}

// ================= OPPSTART =================
$('v-focus').onclick = () => { view = 'focus'; $('v-focus').setAttribute('aria-pressed', 'true'); $('v-all').setAttribute('aria-pressed', 'false'); animateView(MAP.focus); };
$('v-all').onclick = () => { view = 'all'; $('v-all').setAttribute('aria-pressed', 'true'); $('v-focus').setAttribute('aria-pressed', 'false'); animateView(MAP.view); };
$('end').onclick = endDay;
addEventListener('resize', updateScale);

function start(data) {
  buildStaticMap();
  S = data && data.S ? data.S : null;
  if (S) { refresh(); if (S.over === 'won' || S.over === 'dead') endScreen(); }
  else {
    // forhåndsvisning bak tittelskjermen
    previewing = true;
    S = newGame(1234, { name: 'Deg', stats: draft.stats, trait: 'lokalkjent' }, ['mona', 'arild', 'toregil']);
    refresh();
    previewing = false;
    titleScreen();
  }
}
window.claude?.hot?.snapshot?.(() => ({ S }));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});

</script>

</body></html>
